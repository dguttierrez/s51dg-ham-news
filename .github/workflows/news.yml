name: HAM news updater
on:
  workflow_dispatch:
    inputs:
      weekly:
        description: Create weekly archive
        type: boolean
        default: false
  schedule:
    - cron: '15 6 * * *'
    - cron: '30 7 * * 6'
permissions:
  contents: write
concurrency:
  group: ham-news-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate static site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          WEEKLY: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 7 * * 6') || (github.event_name == 'workflow_dispatch' && inputs.weekly) && '1' || '0' }}
        run: python scripts/generate.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html news/latest.json archive/
          if ! git diff --cached --quiet; then
            git commit -m 'Update HAM news'
            git push
          fi
